# 注意：这里刻意不加 -Dfile.encoding=UTF-8。
# 加了会让 Gradle 用 UTF-8 写测试进程的 classpath 参数文件，而 worker JVM 按系统
# 本地编码（这一带是 GBK）去读，含中文的工程路径就会变成乱码，
# 结果是单元测试全部 ClassNotFoundException。保持默认编码反而一致。
org.gradle.jvmargs=-Xmx2560m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 工程目录含中文，AGP 默认会拒绝构建，这里显式放行
android.overridePathCheck=true
kotlin.code.style=official
